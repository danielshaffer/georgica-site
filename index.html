<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgica</title>
<meta name="description" content="Georgica, LLC — a privately held company.">
<meta name="theme-color" content="#EFEAE1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Prata&display=swap">
<style>
:root{
  --sand:#EFEAE1;
  --brown:#4A3A2B;
  --body:#5A5347;
  --soft:#8B8172;
  --rule:#A2947F;
  --link:#4A3A2B;
  --link-hover:#2E2419;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:var(--sand);
  color:var(--body);
  font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:400;
  font-size:17px;
  line-height:1.6;
  letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  position:relative;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%);
}

.page{
  position:relative;
  z-index:1;
  width:100%;
  max-width:34rem;
  margin:0 auto;
  padding:4rem clamp(1.5rem,7vw,3rem);
  display:flex;
  flex-direction:column;
  gap:2.5rem;
}

a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline;text-underline-offset:4px}
a:focus-visible{outline:2px solid var(--link);outline-offset:4px;border-radius:2px}

.masthead{display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.wordmark{
  font-family:"Prata",Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:clamp(2.6rem,7.5vw,3.9rem);
  line-height:1;
  letter-spacing:-0.015em;
  margin:0;
  color:var(--brown);
}
.rule{width:3.5rem;height:1px;background:var(--rule);border:0;margin:0}
.lede{
  margin:0;
  font-size:1rem;
  max-width:27rem;
  text-wrap:balance;
}

.contact{display:flex;flex-direction:column;gap:0.3rem}
.label{
  margin:0;
  font-size:0.68rem;
  font-weight:600;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--soft);
}
.email{margin:0;font-size:1.02rem}

footer{font-size:0.8rem;color:var(--soft)}
footer p{margin:0}
</style>
</head>
<body>
<main class="page">

  <header class="masthead">
    <h1 class="wordmark">Georgica</h1>
    <hr class="rule">
    <p class="lede">A privately held company. Our apps are published as <a href="https://redwheelapps.com">Redwheel Apps</a>.</p>
  </header>

  <section class="contact" aria-labelledby="contact-heading">
    <h2 class="label" id="contact-heading">Contact</h2>
    <p class="email"><a href="mailto:hello@georgica.net">hello@georgica.net</a></p>
  </section>

  <footer>
    <p>&copy; 2026 Georgica, LLC</p>
  </footer>

</main>
</body>
</html>
